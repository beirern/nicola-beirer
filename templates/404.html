{% extends "base.html" %}

{% block title %}404 — Page Not Found | Nicola Beirer{% endblock %}

  <div class="flex flex-wrap gap-3 text-sm">

    <a href="/blog/" class="border border-[#e3d5bc] rounded px-4 py-2 text-[#6b5d47] hover:text-accent hover:border-accent transition-colors">

    </a>
    <a href="/adventures/" class="border border-[#e3d5bc] rounded px-4 py-2 text-[#6b5d47] hover:text-accent hover:border-accent transition-colors">

    </a>
    <a href="/projects/" class="border border-[#e3d5bc] rounded px-4 py-2 text-[#6b5d47] hover:text-accent hover:border-accent transition-colors">

    </a>
    <a href="/resume/" class="border border-[#e3d5bc] rounded px-4 py-2 text-[#6b5d47] hover:text-accent hover:border-accent transition-colors">

{% endblock %}
