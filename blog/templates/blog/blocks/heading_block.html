{% if value.level == 'h2' %}
<h2 class="font-serif text-2xl font-semibold mt-10 mb-3 border-b border-[#e3d5bc] pb-2">{{ value.text }}</h2>
{% elif value.level == 'h3' %}
<h3 class="font-serif text-xl font-semibold mt-8 mb-2">{{ value.text }}</h3>
{% else %}
<h4 class="font-serif text-lg font-medium text-[#4a4033] mt-6 mb-2">{{ value.text }}</h4>
{% endif %}
