<div class="flex items-center gap-2 text-sm" role="group" aria-label="Adventure units" data-unit-toggle>
  <span class="text-[#8a7a5f]">Units</span>
  <button type="button" data-unit="metric" aria-pressed="true" class="rounded border border-[#e3d5bc] px-2 py-1 hover:text-accent">Metric</button>
  <button type="button" data-unit="imperial" aria-pressed="false" class="rounded border border-[#e3d5bc] px-2 py-1 hover:text-accent">Imperial</button>
</div>
