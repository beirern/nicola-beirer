<section class="border-t border-[#e3d5bc] pt-6">
  <div class="flex flex-wrap items-start justify-between gap-2 mb-1">
    <h3 class="font-serif text-lg font-semibold">{{ value.degree }}</h3>
    <span class="text-xs text-[#8a7a5f] shrink-0">{{ value.start_date }} – {{ value.end_date }}</span>
  </div>
  <p class="text-[#6b5d47] text-sm">{{ value.institution }}{% if value.location %} · {{ value.location }}{% endif %}</p>
  {% if value.notes %}
  <p class="text-[#8a7a5f] text-sm mt-2 italic">{{ value.notes }}</p>
  {% endif %}
</section>
