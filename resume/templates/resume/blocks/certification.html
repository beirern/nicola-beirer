<section class="border-t border-[#e3d5bc] pt-6">
  <div class="flex flex-wrap items-start justify-between gap-2 mb-1">
    {% if value.url %}
    <a href="{{ value.url }}" target="_blank" rel="noopener noreferrer"
       class="font-serif text-lg font-semibold text-accent hover:text-[#7c3c1f] hover:underline">{{ value.name }}</a>
    {% else %}
    <h3 class="font-serif text-lg font-semibold">{{ value.name }}</h3>
    {% endif %}
    <span class="text-xs text-[#8a7a5f] shrink-0">{{ value.date }}</span>
  </div>
  <p class="text-[#6b5d47] text-sm">{{ value.issuer }}</p>
</section>
